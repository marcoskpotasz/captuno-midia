<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "DM Sans"; src: url("fonts/DMSans.ttf"); font-weight: 100 1000; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
:root {
  --navy: #12324F;
  --blue: #2A5B87;
  --orange: #F1A205;
  --muted: #5B6B7B;
  --paper: #F4F6F9;
}
body { font-family: "DM Sans", sans-serif; background: var(--paper); color: var(--navy); position: relative; overflow: hidden; }

.top { position: absolute; left: 80px; right: 80px; top: 64px; display: flex; align-items: center; justify-content: space-between; }
.top img { height: 92px; }
.since { font-size: 20px; font-weight: 600; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }

.content { position: absolute; left: 80px; right: 80px; top: 236px; }
.label { display: flex; align-items: center; gap: 16px; color: var(--blue); font-weight: 700; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; }
.label::before { content: ""; width: 48px; height: 4px; background: var(--orange); }
h1 { font-weight: 800; font-size: var(--title-size, 74px); line-height: 1.06; letter-spacing: -1.6px; margin-top: 30px; color: var(--navy); max-width: 920px; }
h1 em { font-style: normal; color: var(--blue); }
.sub { font-size: 31px; line-height: 1.38; margin-top: 28px; color: var(--muted); max-width: 880px; }

.panel {
  position: absolute; left: 0; right: 0; bottom: 0; height: 380px;
  background: var(--navy);
  clip-path: polygon(0 60px, 100% 0, 100% 100%, 0 100%);
}
.lines { position: absolute; left: 80px; bottom: 196px; width: 920px; height: 110px; }
.items { margin-top: 44px; width: 860px; display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 62px 1fr; align-items: baseline; border-top: 1px solid #D5DCE4; padding: 20px 0; }
.item:last-child { border-bottom: 1px solid #D5DCE4; }
.item .n { font-size: 22px; font-weight: 700; color: var(--orange); letter-spacing: 1px; }
.item .t { font-size: 29px; font-weight: 600; line-height: 1.25; color: var(--navy); }
.footer {
  position: absolute; left: 80px; right: 80px; bottom: 64px; color: #fff;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
  border-top: 2px solid var(--orange); padding-top: 26px;
}
.cta { font-size: 33px; font-weight: 800; line-height: 1.15; max-width: 520px; }
.contact { text-align: right; font-size: 22px; line-height: 1.5; color: rgba(255,255,255,.78); font-weight: 500; white-space: nowrap; }
.contact b { color: #fff; font-weight: 700; font-size: 25px; }
</style>
</head>
<body style="--title-size:{{title_size}}">
  <div class="top">
    <img src="logo.png" alt="Leva e Traz Transporte">
    <div class="since">Desde 1997 · São Paulo</div>
  </div>
  <div class="content">
    <div class="label">{{chip}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <div class="items">{{bullets}}</div>
  </div>
  <div class="panel"></div>
  <svg class="lines" viewBox="0 0 920 110" xmlns="http://www.w3.org/2000/svg">{{graphic}}</svg>
  <div class="footer">
    <div class="cta">{{cta}}</div>
    <div class="contact"><b>levaetraztransporte.com.br</b><br>@levaetraz.transporte</div>
  </div>
</body>
</html>
